name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Generate a fixture and exercise every command
        run: |
          python - <<'EOF'
          import json
          import numpy as np

          rng = np.random.default_rng(0)
          a = rng.normal(size=(20, 6)) + np.array([0, 0, 0, 0, 0, 0])
          b = rng.normal(size=(20, 6)) + np.array([8, 8, 8, 8, 8, 8])
          vectors = np.vstack([a, b])
          np.save("fixture.npy", vectors)

          lines = [
              json.dumps({"id": f"id{i}", "vector": v.tolist(), "text": f"chunk {i}"})
              for i, v in enumerate(vectors)
          ]
          with open("fixture.jsonl", "w") as f:
              f.write("\n".join(lines))

          np.save("fixture_new.npy", vectors + rng.normal(scale=0.2, size=vectors.shape))
          EOF

          embed-explorer stats fixture.jsonl
          embed-explorer stats fixture.jsonl --json
          embed-explorer neighbors fixture.jsonl --id id0 --k 5
          embed-explorer neighbors fixture.npy --vector "0,0,0,0,0,0" --k 3 --json
          embed-explorer duplicates fixture.jsonl --threshold 0.8
          embed-explorer cluster fixture.npy --k 2 --seed 0 --json
          embed-explorer cluster fixture.npy --auto-k --k-min 2 --k-max 4
          embed-explorer outliers fixture.npy --k 2 --top 5
          embed-explorer drift fixture.npy fixture_new.npy --k 2 --json
